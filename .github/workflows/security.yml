name: PassGuard Security Checks

on:
  push:
  pull_request:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and security tools
        run: python -m pip install -r requirements.txt bandit pip-audit
      - name: Run tests
        run: pytest -q
      - name: Run Bandit
        run: bandit -r passguard -x passguard/hashing_demo.py
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
